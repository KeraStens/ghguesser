<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Green Hell: Picture Guesser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Staatliches&family=Special+Elite&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- LANDING -->
<section id="screen-landing" class="screen active landing">
  <div class="landing-inner">
    <p class="eyebrow">ONBOARD ARCHIVE — CORNER RECOGNITION DRILL</p>
    <h1 class="hero-title">GREEN HELL<br><span>PICTURE GUESSER</span></h1>
    <p class="hero-sub">You're shown a photo from a lap of the Nordschleife. Pin where it was taken. Three tries. Every pin gets you a read on hot or cold.</p>
    <div class="landing-actions">
      <button id="play-btn" class="btn btn-primary">Play</button>
      <button id="map-btn" class="btn btn-secondary">Map</button>
    </div>
    <p class="landing-note">5 pictures per run · 3 pins each · closer pins score higher</p>
  </div>
</section>

<!-- MAP VIEWER -->
<section id="screen-map" class="screen map-viewer-screen">
  <header class="game-hud">
    <button id="map-back-btn" class="btn-link">&larr; back to menu</button>
  </header>
  <div id="map-viewer-container" class="map-viewer-frame"></div>
</section>

<!-- GAME -->
<section id="screen-game" class="screen game-screen">
  <header class="game-hud">
    <span id="round-counter" class="hud-tag"></span>
    <span id="pins-counter" class="hud-tag"></span>
  </header>

  <div class="game-body">
    <div class="scene-panel">
      <div class="polaroid">
        <img id="scene-img" src="" alt="Track photo" />
        <button type="button" id="scene-expand-btn" class="expand-btn" title="View full size" aria-label="View full size">&#10021;</button>
      </div>
      <div id="tip-box" class="tip-box"></div>
    </div>

    <div id="map-container" class="map-panel"></div>
  </div>

  <button id="next-round-btn" class="btn btn-primary next-round-btn">Next picture</button>
</section>

<!-- FINAL / RESULTS -->
<section id="screen-final" class="screen setup-screen">
  <div class="panel">
    <h2 id="final-title" class="panel-title">Lap Complete</h2>
    <p id="final-score" class="final-score"></p>
    <ul id="final-breakdown" class="final-breakdown"></ul>
    <button id="play-again-btn" class="btn btn-primary btn-block">Play Again</button>
  </div>
</section>

<!-- IMAGE LIGHTBOX (full-size screenshot view) -->
<div id="image-lightbox" class="image-lightbox">
  <button type="button" id="lightbox-close-btn" class="image-lightbox-close" aria-label="Close">&times;</button>
  <img id="lightbox-img" src="" alt="Track photo, full size" />
</div>

<script src="js/game.js"></script>
<script src="js/map.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
